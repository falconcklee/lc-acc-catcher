# The site on port 8080; /healthz for the health checks; no directory listings; long caching for assets only.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok": true}';
    }
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
